<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio lights check</title>
<style>
 body{margin:0;background:#111;color:#eee;font:13px/1.5 ui-monospace,Consolas,monospace}
 #out{padding:12px;white-space:pre-wrap;word-break:break-word}
 iframe{width:520px;height:300px;border:1px solid #333;background:#000}
 .ok{color:#5fd4a8} .bad{color:#ff6b6b}
</style>
</head>
<body>
<!-- THE LIGHTS CHECK (Lloyd, 2026-09-05): everything the studio loads except the UI, so lights.js
     and export.js are measured on their own. It drives the demo project through the engine in song
     mode with a REAL hall in the iframe, then exports the show and reads back what landed. -->
<div id="out">running...</div>
<iframe id="sim" src="../index.html?embed=1&amp;show=live"></iframe>

<script src="../show/lightshow.js"></script>
<script src="../show/looks2.js" onerror="window.NO_LOOKS2=1"></script>
<script src="model.js"></script>
<script src="machines.js" onerror="window.NO_MACHINES=1"></script>
<script src="engine.js" onerror="window.NO_ENGINE=1"></script>
<script src="lights.js"></script>
<script src="export.js"></script>
<script>
'use strict';
const out=document.getElementById('sim').ownerDocument.getElementById('out');
const log=[]; const say=t=>{ log.push(t); out.textContent=log.join('\n'); };

// THE STUB ENGINE: machines.js and engine.js are the audio owner's files and may not exist yet.
// When they do not, this stands in so the lights runtime is still measured end to end: a clock that
// walks the song at the project's bpm, a beat shaped bass band, and an offline render of a kick on
// every beat so the export has real audio to analyse.
function stubEngine(getProj){
 let t0=0, playing=false, mode='song', paused=0;
 const E={
  stub:true, ac:null, mode, playing:false, loop:false,
  init(){ if(!E.ac)E.ac=new (window.AudioContext||window.webkitAudioContext)(); },
  rebuild(){}, invalidate(){}, seek(){}, noteOn(){}, noteOff(){}, setParam(){}, setMixer(){}, setFx(){},
  play(o){ mode=(o&&o.mode)||'song'; E.mode=mode; t0=performance.now()/1000-paused; playing=true; E.playing=true; },
  pause(){ paused=performance.now()/1000-t0; playing=false; E.playing=false; },
  stop(){ playing=false; E.playing=false; paused=0; },
  pos(){ const p=getProj(), sec=Studio.stepSeconds(p.bpm), t=playing?performance.now()/1000-t0:paused;
   const step=t/sec; return {step, t, bar:Math.floor(step/16), beat:Math.floor(step/4)%4, stepInBar:step%16, loopSteps:Studio.songLengthBars(p)*16}; },
  analyser:{ read(o){ const p=getProj(), t=E.pos().t, ph=(t/(60/p.bpm))%1;
   const k=Math.exp(-ph*6); o.bass=k; o.mid=0.3+0.3*k; o.high=0.2+0.2*(1-ph); o.rms=0.3+0.6*k; o.onset=ph<0.05?1:0; return o; } },
  master:null,
  async render(proj){
   // a kick on every beat for 10 s: enough real audio for the frame analysis to have shape
   const sr=44100, dur=10, oac=new OfflineAudioContext(2,sr*dur,sr), beat=60/(proj.bpm||124);
   for(let t=0;t<dur-0.2;t+=beat){
    const o=oac.createOscillator(), g=oac.createGain();
    o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.09);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.8,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
    o.connect(g); g.connect(oac.destination); o.start(t); o.stop(t+0.35);
   }
   return oac.startRendering();
  },
 };
 return E;
}

const R={ok:false, engine:'', steps:{}};
(async function main(){
 const proj=Studio.demoProject();
 const sim=document.getElementById('sim');
 // WAIT FOR THE HALL, NOT FOR A CLOCK (2026-09-27): the hall's message listener exists only once
 // its scene has built, and on a loaded PC or a GPU-less sandbox that takes far longer than the
 // old load + 1.2 s. Frames posted before it are lost, which read as a dead hall (frameT 0).
 const hallReady=()=>!!(sim.contentWindow&&sim.contentWindow.ngvShow);
 for(const t0w=performance.now(); !hallReady()&&performance.now()-t0w<90000;)await new Promise(r=>setTimeout(r,200));
 R.steps.hallReady=hallReady();
 // the hall shares this page's thread (same origin), and its first frames compile shaders for
 // seconds at a time. A song started then runs on the audio clock while no frame is drawn and
 // jumps straight past bar 1, so start only once frames arrive steadily (30 in a row, each under
 // 100 ms apart; 60 s give-up).
 await new Promise(done=>{ let run=0, last=performance.now(); const t0s=last;
  (function f(){ const now=performance.now(); run=now-last<100?run+1:0; last=now;
   if(run>=30||now-t0s>60000)return done(); requestAnimationFrame(f); })(); });

 let eng;
 if(window.Studio.createEngine){ eng=Studio.createEngine({project:()=>proj,onNote:()=>{}}); R.engine='engine.js'; }
 else { eng=stubEngine(()=>proj); R.engine='stub (engine.js absent)'; }
 say('engine: '+R.engine);
 try{ eng.init(); if(eng.ac&&eng.ac.state==='suspended')await eng.ac.resume(); }catch(e){ say('init: '+e.message); }
 if(eng.rebuild)eng.rebuild();

 const L=Studio.createLights({project:()=>proj, engine:()=>eng, iframe:()=>sim});
 window.L=L;

 // 1) the look at the very start, before the transport moves
 L.tick(); L.tick(); L.tick(); L.tick();
 const look0=L.state.look;

 // up to three tries: a stall can still land mid-song, and a try that never saw a frame inside
 // bar 1 (on the studio's side or the hall's) has measured nothing, so it goes again
 let bar1Look='', crossed=false, hallBar1='', hallLayersBar1=null, crossStep=0, tries=0;
 for(;tries<3;tries++){
 eng.stop(); eng.play({mode:'song',fromStep:0});
 bar1Look=''; crossed=false; hallBar1=''; hallLayersBar1=null; crossStep=0;
 const t0=performance.now();
 await new Promise(done=>{
  (function loop(){
   L.tick();
   const p=eng.pos();
   if(!crossed&&p.step>=17){ crossed=true; bar1Look=L.state.look; crossStep=p.step; }
   if(crossed&&crossStep>=32)return done();
   // what the HALL shows while bar 1 plays (a frame or two behind the post), read inside bar 1:
   // by the time the loop ends the song may be on its next cue
   const hw=sim.contentWindow&&sim.contentWindow.ngvShow;
   if(hw&&p.step>=18&&p.step<32){ hallBar1=hw.state.look; hallLayersBar1=hw.state.layers?hw.state.layers.map(l=>l.look):null; }
   // done once bar 1 is crossed AND the hall's clock is past 2 s, not after a fixed 3 s: a slow
   // machine gets fewer frames in 3 s and the clock only moves per frame. 60 s is the give-up.
   const ft=sim.contentWindow&&sim.contentWindow.ngvShow&&sim.contentWindow.ngvShow.frame.t;
   // the hall runs a frame or two behind the post, so keep reading until it shows bar 1's look or
   // bar 1 is over (hallBar1 then holds the last thing the hall showed inside bar 1)
   if((crossed&&ft>2.2&&(hallBar1===bar1Look||p.step>=32))||performance.now()-t0>60000)return done();
   requestAnimationFrame(loop);
  })();
 });
 if(crossed&&crossStep<32&&hallBar1)break;
 }
 R.steps.tries=tries+1; R.steps.crossStep=Math.round(crossStep*10)/10;
 const frameT=(sim.contentWindow&&sim.contentWindow.ngvShow&&sim.contentWindow.ngvShow.frame.t)||0;
 const hallLook=hallBar1;
 const hallOn=!!(sim.contentWindow&&sim.contentWindow.ngvShow&&sim.contentWindow.ngvShow.on);
 eng.stop();

 // the hall must also have been handed a LAYER STACK, not just the flat state: that is what makes
 // it paint through the compositor rather than the single-look path
 const hallLayers=hallLayersBar1&&hallLayersBar1.map(look=>({look,family:window.NGVShow.lookFamily(look)}));
 R.steps.look0=look0; R.steps.bar1Look=bar1Look; R.steps.hallLook=hallLook; R.steps.hallOn=hallOn;
 R.steps.hallLayers=hallLayers?hallLayers.length:'none';
 R.steps.hallLayer0=hallLayers&&hallLayers[0]?hallLayers[0].look+'/'+hallLayers[0].family:'';
 R.steps.frameT=Math.round(frameT*100)/100; R.steps.endStep=Math.round(eng.pos().step*10)/10;
 R.assert1=(look0==='pulse');
 R.assert2=(frameT>2);
 R.assert3=(bar1Look==='beatwave'&&hallLook==='beatwave'&&!!hallLayers&&hallLayers.length===4&&hallLayers[0].look==='beatwave');
 say('look at step 0: '+look0+'   look after bar 1: '+bar1Look+'   hall look: '+hallLook);
 say('iframe ngvShow.frame.t = '+R.steps.frameT+'  (needs > 2), hall on = '+hallOn);

 // 2) a live press with record armed writes into the pattern
 const lm=proj.machines.find(m=>m.type==='lights');
 const before=lm.patterns[lm.curPat].notes.length;
 eng.play({mode:'song',fromStep:0});
 await new Promise(r=>setTimeout(r,120));
 L.setRecord(true,1);
 const wrote=L.press('look','strobe');
 const wroteLvl=L.press('level',0.4);
 L.setRecord(false,1);
 eng.stop();
 R.steps.recordedNote=!!wrote; R.steps.recordedLevel=!!wroteLvl;
 R.steps.notesBefore=before; R.steps.notesAfter=lm.patterns[lm.curPat].notes.length;
 R.assert4=!!wrote&&!!wroteLvl&&lm.patterns[lm.curPat].notes.length>before;
 say('record: wrote note '+JSON.stringify(wrote)+', level '+JSON.stringify(wroteLvl));
 // put the demo back the way it was so the export matches the demo project
 lm.patterns[lm.curPat].notes=lm.patterns[lm.curPat].notes.slice(0,before);
 if(wroteLvl)lm.patterns[lm.curPat].level[wroteLvl.s]=null;
 L.invalidate();

 // 3) the export: three files into show/, all five frame arrays the same length
 say('exporting "verify"...');
 try{
  const res=await Studio.exportShow(proj,eng,'verify',(t,p)=>say('  '+t+' '+Math.round(p*100)+'%'));
  const lens=Object.keys(res.cues.frames).map(k=>res.cues.frames[k].length);
  R.steps.wavBytes=res.wav.byteLength;
  R.steps.frameLens=lens;
  R.steps.cueCount=res.cues.cues.length;
  R.steps.duration=res.cues.duration;
  R.steps.sections=res.cues.sections.map(s=>s.label);
  R.steps.url=res.url;
  const wavOk=(await fetch('../show/verify.wav?x='+Date.now())).ok;
  const cf=await (await fetch('../show/verify.cues.json?x='+Date.now())).json();
  const pj=await (await fetch('../show/verify.project.json?x='+Date.now())).json();
  const list=await Studio.listShows();
  const readLens=Object.keys(cf.frames).map(k=>cf.frames[k].length);
  R.steps.filesOnDisk={wav:wavOk, cues:!!cf.frames, project:!!(pj&&pj.machines), inShowsJson:list.indexOf('verify')>=0};
  R.steps.readFrameLens=readLens;
  R.assert5=wavOk&&!!cf.frames&&!!(pj&&pj.machines)&&list.indexOf('verify')>=0;
  R.assert6=lens.every(x=>x===lens[0])&&readLens.every(x=>x===lens[0])&&lens[0]>10;
 }catch(e){ R.steps.exportError=String(e&&e.message||e); R.assert5=false; R.assert6=false; }

 // 4) SIX LAYERS (2026-09-05). A rack of six Lights machines, one per layer, the second of them
 // synced to the drums. Three things are measured: the stack resolves to six layers, six layers
 // painted together are brighter than one but nowhere near six times brighter and never wash the
 // hall to white, and the synced layer's trigger index steps on the drum notes and wraps with the
 // drum pattern rather than running off down the song.
 const LOOK6=['pulse','beatwave','sparkle','rainbow','sweep','strobe'];
 function layerProject(){
  const pr=Studio.newProject('layers');
  const drums=Studio.newMachine('beatbox','Drums'); const dp=drums.patterns.A1;
  [0,4,8,12].forEach(s=>Studio.addNote(dp,{s,n:0,v:1,l:1}));      // kick on every beat
  [4,12].forEach(s=>Studio.addNote(dp,{s,n:1,v:0.9,l:1}));        // snare doubles two of them
  pr.machines.push(drums);
  for(let i=0;i<6;i++){ const m=Studio.newMachine('lights','L'+i);
   m.layer=i; m.sync=i===1?drums.id:'grid'; m.params.level=1;
   const p=m.patterns.A1;
   Studio.addNote(p,{s:0,n:Studio.lightKeyIndex('look',LOOK6[i]),v:1,l:1});
   Studio.addNote(p,{s:0,n:Studio.lightKeyIndex('palette','helix'),v:1,l:1});
   pr.machines.push(m); }
  for(const m of pr.machines)Studio.placeBlock(pr,m.id,0,'A1',1);
  return pr;
 }
 // a synthetic pixel map with the same fields index.html hands the compositor
 function makeP(n){ const per=n/12, P={n, s:new Float32Array(n), col:new Int32Array(n),
   colx:new Float32Array(n), gap:new Int32Array(n), pid:new Int32Array(n)};
  for(let i=0;i<n;i++){ const c=Math.floor(i/per); P.col[i]=c; P.colx[i]=(c%6)/5;
   P.s[i]=(i%per)/(per-1); P.gap[i]=i%8; P.pid[i]=i; }
  return P; }
 function warm(show,a,P,layers){ show.frame.t=0; show.sm.lastT=0;
  for(let k=0;k<50;k++){ show.frame.t+=0.016; show.paintLayers(a,P,layers); } }
 const mean=a=>{ let s=0; for(let i=0;i<a.length;i++)s+=a[i]; return s/a.length; };
 // a wash is a PIXEL pinned white on all three channels; one hot channel is just a saturated colour
 const washed=a=>{ let c=0, n=a.length/3; for(let i=0;i<n;i++)if(a[i*3]>=0.999&&a[i*3+1]>=0.999&&a[i*3+2]>=0.999)c++; return c/n; };
 const spread=a=>{ const m=mean(a); let s=0; for(let i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m); return Math.sqrt(s/a.length); };

 try{
  const lpr=layerProject();
  let curStep=0;
  const fake={mode:'pattern', playing:true, pos:()=>({step:curStep,t:0})};
  const LP=Studio.createLights({project:()=>lpr, engine:()=>fake, iframe:()=>null});
  LP.resolve({step:0});
  R.steps.layerCount=LP.state.layers.length;
  R.steps.layerLooks=LP.state.layers.map(l=>l.look);
  R.assert7=LP.state.layers.length===6&&LOOK6.every((n,i)=>LP.state.layers[i].look===n);

  const P=makeP(240), a1=new Float32Array(720), a6=new Float32Array(720);
  const layers=LP.state.layers.map(l=>Object.assign({},l));
  const setF=s=>{ s.frame.bpm=124; s.frame.beatN=1; s.frame.beatPhase=0.25; s.frame.barPhase=0.3;
   s.frame.bass=0.8; s.frame.mid=0.6; s.frame.high=0.5; s.frame.rms=0.7; s.frame.onset=0;
   s.state.level=1; s.state.hitAt=-9; };
  const s1=window.NGVShow.createShow(), s6=window.NGVShow.createShow();
  setF(s1); setF(s6);
  warm(s1,a1,P,[layers[0]]); warm(s6,a6,P,layers);
  const m1=mean(a1), m6=mean(a6), ratio=m1>0?m6/m1:0;
  R.steps.mean1=Math.round(m1*1000)/1000; R.steps.mean6=Math.round(m6*1000)/1000;
  R.steps.ratio=Math.round(ratio*100)/100; R.steps.washed=Math.round(washed(a6)*1000)/1000;
  R.steps.spread6=Math.round(spread(a6)*1000)/1000;
  R.assert8=(ratio>=1.0&&ratio<=3.0&&washed(a6)<0.02&&spread(a6)>0.05&&m6>0.01);
  say('layers: '+R.steps.layerCount+'  mean 1 = '+R.steps.mean1+'  mean 6 = '+R.steps.mean6+'  ratio '+R.steps.ratio+'  white pixels '+R.steps.washed+'  spread '+R.steps.spread6);

  // the synced layer: [0,4,8,12] are the drum steps, the pattern is 16 long, so step 16 is step 0
  const probe=s=>{ curStep=s; LP.resolve({step:s}); const L=LP.state.layers[1];
   return {n:L.trigN, tp:Math.round(L.trigPhase*1000)/1000, cy:Math.round(L.cyclePhase*1000)/1000}; };
  const pr0=probe(0), pr4=probe(4), pr6=probe(6), pr12=probe(12), pr16=probe(16), pr18=probe(18);
  R.steps.sync=[pr0,pr4,pr6,pr12,pr16,pr18];
  R.assert9=(pr0.n===0&&pr0.cy===0&&pr4.n===1&&pr4.cy===0.25&&pr6.n===1&&pr6.tp===0.5
   &&pr12.n===3&&pr12.cy===0.75&&pr16.n===0&&pr16.cy===0&&pr18.n===0&&pr18.tp===0.5);
  say('sync to drums: '+JSON.stringify(R.steps.sync));
 }catch(e){ R.steps.layerError=String(e&&e.stack||e); R.assert7=false; R.assert8=false; R.assert9=false; }

 // 5) THE EXPORT PLAYS WHAT THE RACK PLAYED (2026-09-27, Codex review of e0b4736, findings 1 and 2).
 // A layer synced to an uneven drum pattern, a second on the grid with its own cues, over four bars.
 // The live runtime is sampled at quarter steps and the exported cue file is played at the same
 // moments through the hall's own player (frameFromCues + applyCues); every layer must land on the
 // same look, palette, gain, trigger index, trigger phase and cycle phase. Then a soloed layer: the
 // export must dim the others exactly as the rack does.
 function syncProject(){
  const pr=Studio.newProject('syncx');
  const drums=Studio.newMachine('beatbox','Drums'); const dp=drums.patterns.A1;
  [0,3,6,10].forEach(s=>Studio.addNote(dp,{s,n:0,v:1,l:1}));        // an uneven kick, not the beat grid
  pr.machines.push(drums);
  const a=Studio.newMachine('lights','Synced'); a.layer=0; a.sync=drums.id; a.params.level=1;
  const ap=a.patterns.A1;
  Studio.addNote(ap,{s:0,n:Studio.lightKeyIndex('look','beatwave'),v:1,l:1});
  Studio.addNote(ap,{s:0,n:Studio.lightKeyIndex('palette','ice'),v:1,l:1});
  Studio.addNote(ap,{s:5,n:Studio.lightKeyIndex('palette','ember'),v:1,l:1});
  Studio.addNote(ap,{s:9,n:Studio.lightKeyIndex('look','hallchase'),v:1,l:1});
  pr.machines.push(a);
  const b=Studio.newMachine('lights','Grid'); b.layer=1; b.sync='grid'; b.params.level=0.8;
  Studio.addNote(b.patterns.A1,{s:0,n:Studio.lightKeyIndex('look','sparkle'),v:1,l:1});
  Studio.addNote(b.patterns.A1,{s:8,n:Studio.lightKeyIndex('look','sweep'),v:1,l:1});
  pr.machines.push(b);
  for(const m of pr.machines)Studio.placeBlock(pr,m.id,0,'A1',4);
  return pr;
 }
 const r3=x=>Math.round(x*1000)/1000;
 function cueFile(pr){ const T=Studio.timeline(pr), dur=T.time(Studio.songLengthBars(pr)*16)+1;
  const g=Studio.beatGrid(pr,pr.bpm||124,dur), z=[0,0];
  const cf={hop_s:0.0232, bpm:pr.bpm||124, beats:g.beats, downbeats:g.downbeats, cues:Studio.cueList(pr),
   frames:{rms:z,bass:z,mid:z,high:z,onset:z}};
  if(Studio.stepTable)cf.stepT=Studio.stepTable(pr);
  return cf; }
 const pick=l=>l?{look:l.look, pal:l.palette, gain:r3(l.gain==null?1:l.gain), n:l.trigN==null?null:l.trigN|0,
  tp:l.trigPhase==null?null:r3(l.trigPhase), cy:l.cyclePhase==null?null:r3(l.cyclePhase)}:null;
 try{
  const spr=syncProject(); let st=0;
  const T=Studio.timeline(spr);
  const eng5={mode:'song', playing:false, pos:()=>{ const a=T.at(st); return {step:st, t:T.time(st), beatN:a.beatN, beatPhase:a.beatPhase, barPhase:a.barPhase}; }};
  const LV=Studio.createLights({project:()=>spr, engine:()=>eng5, iframe:()=>null});
  const cf=cueFile(spr), PL=window.NGVShow.createShow();
  const bad=[]; let n=0;
  for(st=0.25;st<63.9;st+=0.25){
   LV.tick(); LV.resolve(eng5.pos());
   // the export's own clock: the step table it wrote. Cue stamps and the table share one rounding,
   // so a cue on step s lands at exactly the time the table gives step s
   const i0=Math.floor(st), t=cf.stepT?cf.stepT[i0]+(st-i0)*(cf.stepT[i0+1]-cf.stepT[i0]):T.time(st);
   PL.frameFromCues(cf,t); PL.applyCues(cf.cues,t);
   // grid layers read beat and bar off the frame in both players, so they are compared as painted
   const gridL=l=>l&&l.trigN==null?Object.assign({},l,{trigN:PL.frame.beatN,trigPhase:PL.frame.beatPhase,cyclePhase:PL.frame.barPhase}):l;
   for(let i=0;i<2;i++){ const a=pick(LV.state.layers[i]); const b=pick(i===1?gridL(PL.state.layers&&PL.state.layers[i]):PL.state.layers&&PL.state.layers[i]);
    n++;
    const same=a&&b&&a.look===b.look&&a.pal===b.pal&&a.gain===b.gain&&(i===1||(a.n===b.n&&Math.abs(a.tp-b.tp)<0.002&&Math.abs(a.cy-b.cy)<0.002));
    if(!same&&bad.length<6)bad.push({step:st,layer:i,live:a,exported:b}); if(!same)bad.count=(bad.count||0)+1; }
  }
  R.steps.syncParity={compared:n, mismatches:bad.count||0, first:bad};
  R.assert10=n>400&&!bad.count;
  say('export vs live, synced layer: '+(bad.count||0)+' mismatches of '+n+(bad.length?'  first '+JSON.stringify(bad[0]):''));
 }catch(e){ R.steps.syncError=String(e&&e.stack||e); R.assert10=false; }

 try{
  const pr=Studio.newProject('solox');
  for(let i=0;i<3;i++){ const m=Studio.newMachine('lights','S'+i); m.layer=i; m.params.level=0.9;
   Studio.addNote(m.patterns.A1,{s:0,n:Studio.lightKeyIndex('look',['pulse','sweep','sparkle'][i]),v:1,l:1});
   pr.machines.push(m); Studio.placeBlock(pr,m.id,0,'A1',1); }
  pr.machines[1].solo=true;
  const eng6={mode:'song', playing:false, pos:()=>({step:1,t:0})};
  const LS=Studio.createLights({project:()=>pr, engine:()=>eng6, iframe:()=>null}); LS.resolve({step:1});
  const liveG=LS.state.layers.map(l=>r3(l.gain));
  const PL=window.NGVShow.createShow(); const cf=cueFile(pr); PL.frameFromCues(cf,0.2); PL.applyCues(cf.cues,0.2);
  const expG=(PL.state.layers||[]).map(l=>r3(l.gain==null?1:l.gain));
  R.steps.solo={live:liveG, exported:expG};
  R.assert11=liveG.join()==='0,0.9,0'&&expG.join()===liveG.join();
  say('solo: live gains '+liveG.join()+'  exported gains '+expG.join());
 }catch(e){ R.steps.soloError=String(e&&e.stack||e); R.assert11=false; }

 R.ok=!!(R.assert1&&R.assert2&&R.assert3&&R.assert4&&R.assert5&&R.assert6&&R.assert7&&R.assert8&&R.assert9&&R.assert10&&R.assert11);
 say('');
 say(JSON.stringify(R));
 window.LIGHTS_TEST=R;
 console.log(JSON.stringify(R));
 document.title=R.ok?'LIGHTS OK':'LIGHTS FAIL';
})().catch(e=>{ R.error=String(e&&e.stack||e); window.LIGHTS_TEST=R; say('ERROR '+R.error); console.log(JSON.stringify(R)); });
