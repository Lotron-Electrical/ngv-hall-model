<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NGV Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* THE STUDIO (Lloyd, 2026-09-04): the music and the light cues are made side by side on one clock.
   Left is the song, centre is the hall itself in an iframe, right is the lighting desk, along the
   bottom the timeline everything is stamped against. Tokens are index.html's, so the two pages read
   as one instrument. */
:root{--bg:#0e0f11;--rule:#2a2d33;--ink:#e9e6df;--dim:#9a978f;--accent:#b9a887;--ok:#6fbf8a;--panel:#16181c;--rec:#d8433c}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;margin:0;
 display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;margin:0}
button,input,select{font:inherit;color:var(--ink)}
button{background:#1c1f25;border:1px solid var(--rule);padding:5px 10px;cursor:pointer;border-radius:3px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* a pressed control is the accent fill with near-black text: high contrast, never ink on ink */
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#0e0f11;font-weight:500}
button#rec[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
input[type=text],input[type=number],select{background:#101216;border:1px solid var(--rule);padding:4px 6px;border-radius:3px}
input[type=range]{accent-color:var(--accent);width:100%}
label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.sp{flex:1}

/* ---- top bar: name, transport, tempo, key, clocks, level, files */
#top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--rule)}
#top .grp{display:flex;align-items:center;gap:6px}
#top .grp+.grp{border-left:1px solid var(--rule);padding-left:8px}
#top .grp.files{margin-left:auto;border-left:0}   /* stays hard right whichever row it wraps onto */
#name{width:130px}
#bpm{width:56px;text-align:center;font-variant-numeric:tabular-nums}
.clock{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:74px;text-align:center}
.clock.sm{font-size:17px;min-width:62px;color:var(--dim)}
#meter{width:90px;height:10px;background:#101216;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
#meterfill{height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--accent) 70%,var(--rec))}
#msg{color:var(--accent);font-size:12px;min-width:0;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- the three columns */
#mid{flex:1;display:flex;min-height:0}
#song,#lights{background:var(--panel);overflow-y:auto;overflow-x:hidden;flex:none;padding:10px}
#song{width:420px;border-right:1px solid var(--rule)}
#lights{width:300px;border-left:1px solid var(--rule)}
#simwrap{flex:1;min-width:0;position:relative;background:#000}
#sim{width:100%;height:100%;border:0;display:block}
.colhead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.colhead h2{font-size:19px;color:var(--accent);letter-spacing:.04em}

/* ---- song cards */
.sec{border:1px solid var(--rule);border-radius:4px;background:#101216;padding:8px;margin-bottom:8px}
.sec.on{border-color:var(--accent)}
.sec.playing{box-shadow:inset 3px 0 0 var(--ok)}
.sec .hd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sec .hd input{flex:1;min-width:0}
.sec .hd select{width:82px}
.sec .hd button{padding:3px 6px;line-height:1}
.sec .rowg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:6px}
.sec .fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.sec select{width:100%}
.insts{display:flex;flex-wrap:wrap;gap:4px}
.insts button{padding:3px 7px;font-size:12px}
.chk{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.val{color:var(--ink);font-variant-numeric:tabular-nums;font-size:12px;text-transform:none;letter-spacing:0}
#gridwrap{border-top:1px solid var(--rule);padding-top:8px;margin-top:4px}
#grid{display:grid;grid-template-columns:46px repeat(16,1fr);gap:2px;align-items:center}
#grid .lbl{color:var(--dim);font-size:11px;text-transform:uppercase}
#grid .cell{height:20px;border:1px solid var(--rule);border-radius:2px;background:#0c0d10;cursor:pointer;padding:0;min-width:0}
#grid .cell.beat{border-color:#3a3e46}
#grid .cell.on{background:var(--accent);border-color:var(--accent)}
#grid .cell.now{outline:1px solid var(--ok)}

/* ---- lighting desk */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:2px 0 8px}
.pad{position:relative;text-align:left;padding:5px 7px;font-size:12px;line-height:1.2;min-height:30px}
.pad .k{position:absolute;right:5px;top:4px;color:var(--dim);font-size:10px}
.pad[aria-pressed="true"] .k{color:#0e0f11}
.pal{height:32px;border-radius:3px;border:1px solid var(--rule);position:relative;overflow:hidden;padding:0;cursor:pointer}
.pal span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:1px 4px;text-align:left}
/* the key letter needs its own dark chip: on a pale palette (gold, white) plain white text vanished */
.pal b{position:absolute;right:2px;top:2px;color:#fff;font-size:10px;font-weight:400;line-height:1;
 background:rgba(0,0,0,.62);border-radius:2px;padding:1px 3px}
.pal[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
#hit{width:100%;height:40px;font-size:16px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.12em}
#focus{width:100%;margin-bottom:6px}
#lights .colhead{margin-bottom:4px}
#focus[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#0e0f11}
.keyshelp{color:var(--dim);font-size:11px;line-height:1.5;margin-top:8px;border-top:1px solid var(--rule);padding-top:8px}
/* the little on-screen keyboard for the lead */
#kbd{position:relative;height:56px;margin-top:8px;background:#0c0d10;border:1px solid var(--rule);border-radius:3px}
#kbd .w{position:absolute;top:0;bottom:0;border-right:1px solid var(--rule);background:#d9d6cf}
#kbd .w:last-child{border-right:0}
#kbd .b{position:absolute;top:0;height:62%;background:#17191e;border:1px solid #000;border-radius:0 0 2px 2px;z-index:2}
#kbd .w.held{background:var(--accent)}
#kbd .b.held{background:var(--accent);border-color:var(--accent)}
#kbd i{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-style:normal;font-size:9px;color:#5d5a54}

/* ---- timeline */
#tl{flex:none;height:160px;border-top:1px solid var(--rule);background:var(--panel);padding:6px 10px 8px;display:flex;flex-direction:column;gap:5px}
#tlhead{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
#tlbody{position:relative;flex:1;min-height:0;cursor:pointer;user-select:none}
#secs{position:absolute;left:0;right:0;top:0;height:46px}
#secs .blk{position:absolute;top:0;bottom:0;border:1px solid var(--rule);border-radius:3px;background:#141821;overflow:hidden;
 font-size:11px;padding:3px 5px;color:var(--dim);white-space:nowrap}
#secs .blk.on{border-color:var(--accent);background:#1b2029}
#secs .blk b{display:block;color:var(--ink);font-weight:500;font-size:12px}
#lane{position:absolute;left:0;right:0;top:52px;height:44px;background:#0c0d10;border:1px solid var(--rule);border-radius:3px}
#lane .cue{position:absolute;top:2px;bottom:2px;width:5px;margin-left:-2px;border-radius:1px;cursor:pointer}
#lane .cue:hover{box-shadow:0 0 0 2px var(--ink)}
#lane .cue.hit{top:auto;height:9px;bottom:2px}
#lane .cue.lvl{top:auto;height:9px;bottom:14px}
#ruler{position:absolute;left:0;right:0;top:100px;height:18px;color:var(--dim);font-size:10px}
#ruler .bar{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule);padding-left:2px}
#ruler .bar.down{border-left-color:#4a4e57;color:var(--ink)}
#head{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--ok);pointer-events:none;z-index:5}
#head::after{content:'';position:absolute;left:-4px;top:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--ok)}
#tip{position:fixed;z-index:40;background:#20242a;border:1px solid var(--rule);border-radius:4px;padding:4px 7px;font-size:12px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.6)}
#tip[hidden]{display:none}

/* ---- export overlay */
#veil{position:fixed;inset:0;background:rgba(6,7,9,.86);z-index:60;display:flex;align-items:center;justify-content:center}
#veil[hidden]{display:none}
#veilbox{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:20px 24px;width:400px;max-width:90vw}
#veilbox h3{font-size:20px;color:var(--accent);margin-bottom:8px}
#bar{height:8px;background:#101216;border:1px solid var(--rule);border-radius:2px;overflow:hidden;margin:10px 0}
#barfill{height:100%;width:0;background:var(--ok);transition:width .2s linear}
#veilbox a{color:var(--accent)}

/* 1280 wide still has to hold all three columns and the whole desk, so the sides give ground */
@media (max-width:1400px){
 #song{width:360px} #lights{width:268px}
 .pads{gap:4px} .pad{font-size:11px;min-height:31px;padding:5px 6px}
 #top{font-size:13px} .clock{font-size:19px;min-width:66px}
}
</style>
<script src="show/lightshow.js"></script>
</head>
<body>

<div id="top">
 <div class="grp"><h1 style="font-size:20px;color:var(--accent);letter-spacing:.05em">STUDIO</h1>
  <input type="text" id="name" value="untitled" spellcheck="false" title="Project name"></div>
 <div class="grp">
  <button id="play" title="Enter">Play</button>
  <button id="stop" title="Escape">Stop</button>
  <button id="rec" aria-pressed="false" title="R">Record</button>
  <button id="loop" aria-pressed="false">Loop</button></div>
 <div class="grp"><label for="bpm">BPM</label>
  <button id="bpmdn" title="Slower">&minus;</button><input type="number" id="bpm" min="60" max="180" step="1" value="124"><button id="bpmup" title="Faster">+</button></div>
 <div class="grp"><label for="key">Key</label><select id="key"></select>
  <select id="mode"><option value="minor">minor</option><option value="major">major</option></select></div>
 <div class="grp"><span class="clock" id="barbeat">1:1</span><span class="clock sm" id="clock">0:00.0</span></div>
 <div class="grp"><label>Level</label><div id="meter"><div id="meterfill"></div></div></div>
 <div class="grp files"><span id="msg"></span>
  <button id="save">Save</button><button id="load">Load</button><button id="export">Export</button></div>
</div>

<div id="mid">
 <section id="song">
  <div class="colhead"><h2>SONG</h2><span class="sp"></span>
   <button id="addsec">Add</button><button id="dupsec">Duplicate</button><button id="delsec">Delete</button>
   <button id="upsec" title="Move up">&uarr;</button><button id="downsec" title="Move down">&darr;</button></div>
  <div id="seclist"></div>
  <div id="gridwrap"><div class="colhead"><h2 style="font-size:15px" id="gridtitle">DRUMS</h2><span class="sp"></span>
    <button id="gridreset" title="Back to the pattern preset">Reset to preset</button></div>
   <div id="grid"></div></div>
 </section>

 <div id="simwrap"><iframe id="sim" src="index.html?embed=1&amp;show=live" title="The hall"></iframe></div>

 <section id="lights">
  <div class="colhead"><h2>LIGHTS</h2></div>
  <button id="focus" aria-pressed="true" title="Tab">Keys: LIGHTS</button>
  <label>Look</label><div class="pads" id="lookpads"></div>
  <label>Palette</label><div class="pads" id="palpads"></div>
  <label for="level">Level <span class="val" id="levelval">1.00</span></label>
  <input type="range" id="level" min="0" max="1" step="0.01" value="1">
  <div style="height:8px"></div>
  <button id="hit" title="Space">HIT</button>
  <div style="height:8px"></div>
  <label for="quant">Quantise</label>
  <select id="quant"><option value="0">off</option><option value="0.25">1/4 beat</option><option value="1">1 beat</option></select>
  <label style="display:block;margin-top:10px">Lead keyboard</label>
  <div id="kbd"></div>
  <div class="keyshelp" id="keyshelp"></div>
 </section>
</div>

<div id="tl">
 <div id="tlhead"><span>TIMELINE</span><span id="tlinfo"></span><span class="sp"></span>
  <span>Click to seek. Click a cue to delete it.</span>
  <button id="clearcues" style="padding:2px 8px;font-size:12px">Clear cues</button></div>
 <div id="tlbody">
  <div id="secs"></div><div id="lane"></div><div id="ruler"></div><div id="head"></div>
 </div>
</div>

<div id="tip" hidden></div>
<div id="veil" hidden><div id="veilbox">
 <h3 id="vtitle">Exporting</h3>
 <div id="vstep" style="color:var(--dim);font-size:13px">Rendering the music</div>
 <div id="bar"><div id="barfill"></div></div>
 <div id="vlink" style="font-size:13px"></div>
 <div style="text-align:right;margin-top:12px"><button id="vclose">Close</button></div>
</div></div>

<script>
'use strict';
// ============================================================================================
// THE SONG: sections in order, each a card. Everything the ear hears is derived from this and
// the BPM, so the live transport and the offline render read exactly the same object.
// ============================================================================================
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SCALES={minor:[0,2,3,5,7,8,10], major:[0,2,4,5,7,9,11]};
// chord presets in scale degrees, one chord per bar, cycling. Case carries the quality, the
// numeral carries the degree, so the same preset works in either mode.
const PROGS={
 'i VI III VII':['i','VI','III','VII'],
 'i iv VI v':['i','iv','VI','v'],
 'i VII VI VII':['i','VII','VI','VII'],
 'i VI iv V':['i','VI','iv','V'],
 'vi IV I V':['vi','IV','I','V'],
 'I V vi IV':['I','V','vi','IV'],
 'i (hold)':['i'],
};
const PROG_NAMES=Object.keys(PROGS);
const DEG={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7};
// drum presets as 16 step strings, the seed for a section's grid
const DRUMPAT={
 'four':   {kick:'1000100010001000',snare:'0000100000001000',hat:'1010101010101010',clap:'0000000000001000'},
 'offbeat':{kick:'1000100010001000',snare:'0000100000001000',hat:'0010001000100010',clap:'0000100000001000'},
 'break':  {kick:'1001000010010000',snare:'0000100000001000',hat:'1010101010101010',clap:'0000000010000000'},
 'half':   {kick:'1000000000000000',snare:'0000000010000000',hat:'1000100010001000',clap:'0000000000000000'},
 'sparse': {kick:'1000000000001000',snare:'0000000000000000',hat:'0000100000001000',clap:'0000000000000000'},
 'none':   {kick:'0000000000000000',snare:'0000000000000000',hat:'0000000000000000',clap:'0000000000000000'},
};
const DRUM_NAMES=Object.keys(DRUMPAT);
const ROWS=['kick','snare','hat','clap'];
const INSTS=['kick','snare','hat','clap','sub','chords','arp','lead'];
const SECPRESETS=['intro','build','drop','break','outro'];

function patToRows(p){ const d=DRUMPAT[p]||DRUMPAT.four;
 return ROWS.map(r=>d[r].split('').map(c=>c==='1'?1:0)); }

function newSection(kind){
 const k=kind||'intro';
 const s={name:k, bars:8, prog:'i VI III VII', drums:'four', filter:0.6, sweep:false, energy:0.5,
  on:{kick:true,snare:false,hat:true,clap:false,sub:true,chords:true,arp:false,lead:false}};
 if(k==='build'){ s.sweep=true; s.filter=0.85; s.energy=0.7; s.on.snare=true; s.on.arp=true; }
 if(k==='drop'){ s.drums='four'; s.filter=1; s.energy=1; s.on={kick:true,snare:true,hat:true,clap:true,sub:true,chords:true,arp:true,lead:true}; }
 if(k==='break'){ s.drums='sparse'; s.filter=0.35; s.energy=0.25; s.on={kick:false,snare:false,hat:false,clap:false,sub:false,chords:true,arp:true,lead:false}; }
 if(k==='outro'){ s.drums='half'; s.filter=0.5; s.energy=0.3; s.on={kick:true,snare:false,hat:false,clap:false,sub:true,chords:true,arp:false,lead:false}; }
 return s;
}

const song={
 name:'untitled', bpm:124, key:'C', mode:'minor',
 sections:[newSection('intro')],
 drums:{},              // sectionIndex -> 4 rows of 16, the grid as edited
 lead:[],               // recorded lead notes {t,dur,midi}
 cues:[],               // light cues {t, look?, palette?, level?, hit?}
 look:'pulse', palette:'helix', level:1,
};
let sel=0;              // the selected section

function rowsFor(i){ if(!song.drums[i])song.drums[i]=patToRows(song.sections[i].drums); return song.drums[i]; }
const spb=()=>60/song.bpm;                              // seconds per beat
const totalBars=()=>song.sections.reduce((a,s)=>a+s.bars,0);
const totalDur=()=>totalBars()*4*spb();
function secStarts(){ const out=[]; let b=0; for(const s of song.sections){ out.push(b); b+=s.bars; } return out; }
function secAtBar(bar){ let b=0; for(let i=0;i<song.sections.length;i++){ const n=song.sections[i].bars; if(bar<b+n)return {i,bar0:b}; b+=n; } return null; }

// ============================================================================================
// THE ENGINE: one chain built on whatever AudioContext it is handed. Live gets the real one,
// Export gets an OfflineAudioContext, and both walk the same scheduleStep, so a bounce sounds
// like what was played.
// ============================================================================================
const dB=v=>Math.pow(10,v/20);
const LVL={kick:dB(-6),snare:dB(-8),hat:dB(-16),clap:dB(-10),sub:dB(-8),chords:dB(-12),arp:dB(-14),lead:dB(-10)};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const clamp=(x,a,b)=>x<a?a:x>b?b:x;

function noiseBuffer(ac){ const n=Math.floor(ac.sampleRate*2), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1; return b; }

function makeEngine(ac, snap){
 const master=ac.createGain(); master.gain.value=0.9;
 const lim=ac.createDynamicsCompressor();
 lim.threshold.value=-3; lim.knee.value=0; lim.ratio.value=12; lim.attack.value=0.003; lim.release.value=0.1;
 master.connect(lim); lim.connect(ac.destination);
 const duck=ac.createGain(); duck.gain.value=1; duck.connect(master);   // chords, arp and sub ride the sidechain
 const dry=ac.createGain(); dry.connect(master);                        // drums bypass it
 const NB=noiseBuffer(ac);
 const beat=60/snap.bpm, stepDur=beat/4;
 const scale=SCALES[snap.mode]||SCALES.minor, keyRoot=NOTE_NAMES.indexOf(snap.key)<0?0:NOTE_NAMES.indexOf(snap.key);
 const starts=[]; { let b=0; for(const s of snap.sections){ starts.push(b); b+=s.bars; } }
 const bars=snap.sections.reduce((a,s)=>a+s.bars,0);
 const E={ac, master, duck, dry, steps:bars*16, stepDur, beat, duration:bars*4*beat, lastLeadHz:0, lastLeadEnd:-9};

 function noise(when,dur){ const s=ac.createBufferSource(); s.buffer=NB; s.loop=true;
  s.start(when,Math.random()*1.5); s.stop(when+dur); return s; }
 function env(when,peak,dec,atk){ const g=ac.createGain(); const a=atk===undefined?0.002:atk;
  g.gain.setValueAtTime(0.0001,when); g.gain.linearRampToValueAtTime(peak,when+a);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dec); return g; }

 // ---- drums. Written straight rather than sampled: the whole track has to render offline.
 function kick(when,gain){
  const o=ac.createOscillator(), g=env(when,gain,0.3,0.004); o.type='sine';
  o.frequency.setValueAtTime(150,when); o.frequency.exponentialRampToValueAtTime(45,when+0.04);
  o.connect(g); g.connect(dry); o.start(when); o.stop(when+0.34);
  const c=ac.createOscillator(), cg=env(when,gain*0.5,0.005,0.001); c.type='square'; c.frequency.value=900;
  c.connect(cg); cg.connect(dry); c.start(when); c.stop(when+0.02);
 }
 function snare(when,gain){
  const n=noise(when,0.18), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.8;
  const g=env(when,gain,0.16); n.connect(bp); bp.connect(g); g.connect(dry);
  const o=ac.createOscillator(), og=env(when,gain*0.5,0.09); o.type='triangle'; o.frequency.value=180;
  o.connect(og); og.connect(dry); o.start(when); o.stop(when+0.1);
 }
 function hat(when,gain,open){
  const d=open?0.18:0.04, n=noise(when,d+0.02), hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000;
  const g=env(when,gain,d,0.001); n.connect(hp); hp.connect(g); g.connect(dry);
 }
 function clap(when,gain){
  for(let k=0;k<3;k++){ const w=when+k*0.01, n=noise(w,0.14);
   const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=1.2;
   const g=env(w,gain*(k===2?1:0.6),0.12,0.001); n.connect(bp); bp.connect(g); g.connect(dry); }
 }
 // the kick ducks everything melodic, deeper as the section's energy climbs
 function duckIt(when,energy){
  const floorV=1-0.6*energy;
  duck.gain.cancelScheduledValues(when);
  duck.gain.setValueAtTime(floorV,when);
  duck.gain.linearRampToValueAtTime(1,when+beat*0.6);
 }
 // ---- sub: a sine an octave under the chord root with a quiet saw for edge
 function sub(when,dur,midi,gain){
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=120;
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(gain,when+0.012);
  g.gain.setValueAtTime(gain,when+Math.max(0.02,dur-0.06));
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  lp.connect(g); g.connect(duck);
  const f=mtof(midi-12);
  for(const [type,amp] of [['sine',1],['sawtooth',0.28]]){ const o=ac.createOscillator(); o.type=type; o.frequency.value=f;
   const a=ac.createGain(); a.gain.value=amp; o.connect(a); a.connect(lp); o.start(when); o.stop(when+dur+0.05); }
 }
 // ---- chords: three detuned saws a note, spread a little left and right
 function chord(when,dur,notes,cut,gain){
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cut; lp.Q.value=0.7;
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(gain,when+0.08);
  g.gain.setValueAtTime(gain,when+Math.max(0.1,dur-0.02));
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur+0.4);
  lp.connect(g); g.connect(duck);
  notes.forEach((m,idx)=>{
   const pan=ac.createStereoPanner(); pan.pan.value=(idx-(notes.length-1)/2)*0.28; pan.connect(lp);
   for(const det of [-12,0,12]){ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=det;
    const a=ac.createGain(); a.gain.value=1/(notes.length*3); o.connect(a); a.connect(pan); o.start(when); o.stop(when+dur+0.5); }
  });
 }
 // ---- arp: a triangle pluck on every sixteenth
 function pluck(when,midi,cut,gain){
  const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=mtof(midi);
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cut;
  const g=env(when,gain,0.18,0.003); o.connect(lp); lp.connect(g); g.connect(duck);
  o.start(when); o.stop(when+0.2);
 }
 // ---- lead: a monosynth, saw plus a square an octave up, glide when the notes join up
 E.lead=function(when,dur,midi,gain){
  const hz=mtof(midi), gl=(when-E.lastLeadEnd)<stepDur&&E.lastLeadHz>0?0.03:0;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=6;
  lp.frequency.setValueAtTime(2500,when); lp.frequency.linearRampToValueAtTime(1200,when+Math.min(dur,0.4));
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(gain===undefined?LVL.lead:gain,when+0.01);
  g.gain.setValueAtTime(gain===undefined?LVL.lead:gain,when+Math.max(0.02,dur-0.02));
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur+0.08);
  lp.connect(g); g.connect(duck);
  for(const [type,amp,oct] of [['sawtooth',1,0],['square',0.35,1]]){
   const o=ac.createOscillator(); o.type=type;
   const f=hz*Math.pow(2,oct);
   if(gl){ o.frequency.setValueAtTime(E.lastLeadHz*Math.pow(2,oct),when); o.frequency.exponentialRampToValueAtTime(f,when+gl); }
   else o.frequency.setValueAtTime(f,when);
   const a=ac.createGain(); a.gain.value=amp; o.connect(a); a.connect(lp); o.start(when); o.stop(when+dur+0.15);
  }
  E.lastLeadHz=hz; E.lastLeadEnd=when+dur;
 };

 // chord tones for a bar: the numeral's degree gives the root, its case the quality
 function chordOf(sec,barInSec){
  const prog=PROGS[sec.prog]||PROGS['i VI III VII'];
  const sym=prog[barInSec%prog.length];
  const deg=DEG[sym.toLowerCase()]||1, minor=sym===sym.toLowerCase();
  const root=48+keyRoot+scale[(deg-1)%7];
  const third=minor?3:4;
  const notes=[root,root+third,root+7];
  if(sec.energy>0.5)notes.push(root+(minor?10:11));   // a seventh once the section has weight
  return {root,notes};
 }
 const cutOf=f=>300*Math.pow(8000/300,clamp(f,0,1));

 // one sixteenth of the song, scheduled at ac time `when`
 E.scheduleStep=function(gi,when){
  if(gi<0||gi>=E.steps)return;
  const bar=Math.floor(gi/16), st=gi%16;
  let si=0; for(let i=0;i<starts.length;i++){ if(bar>=starts[i])si=i; }
  const sec=snap.sections[si], barInSec=bar-starts[si];
  const li=barInSec*16+st, prog=li/Math.max(1,sec.bars*16);
  const fil=sec.sweep?0.2+(sec.filter-0.2)*prog:sec.filter;
  const cut=cutOf(fil), en=sec.energy, on=sec.on;
  const rows=snap.drums[si]||patToRows(sec.drums);
  const ch=chordOf(sec,barInSec);

  if(on.kick&&rows[0][st]){ kick(when,LVL.kick); duckIt(when,en); }
  if(on.snare&&rows[1][st])snare(when,LVL.snare);
  if(on.clap&&rows[3][st])clap(when,LVL.clap);
  // the grid's hats, plus the in-between sixteenths once the energy is up, every fourth one open
  if(on.hat&&(rows[2][st]||(en>0.6&&st%2===1)))
   hat(when,LVL.hat*(rows[2][st]?1:0.55),en>0.6&&st%4===2);
  if(on.sub){
   if(en>0.5){ if(st===2||st===6||st===10||st===14)sub(when,stepDur*1.6,ch.root,LVL.sub); }
   else if(st===0)sub(when,E.beat*4*0.98,ch.root,LVL.sub);
  }
  if(on.chords&&st===0)chord(when,E.beat*4*0.9,ch.notes,cut,LVL.chords);
  if(on.arp){ // chord tones up then down across two octaves
   const tones=[]; for(let o=0;o<2;o++)for(const n of ch.notes)tones.push(n+12+o*12);
   const walk=tones.concat(tones.slice(1,-1).reverse());
   pluck(when,walk[li%walk.length],cut,LVL.arp);
  }
 };
 // the recorded lead, the same notes live and bounced
 E.scheduleLead=function(t0ac,from,to){
  for(const n of snap.lead){ if(n.t>=from&&n.t<to)E.lead(t0ac+n.t,n.dur,n.midi); }
 };
 return E;
}

// a deep copy of everything the engine reads, so an edit mid render cannot change the bounce
function snapshot(){
 return {bpm:song.bpm,key:song.key,mode:song.mode,
  sections:song.sections.map(s=>({...s,on:{...s.on}})),
  drums:Object.fromEntries(Object.keys(song.drums).map(k=>[k,song.drums[k].map(r=>r.slice())])),
  lead:song.lead.map(n=>({...n}))};
}

// ============================================================================================
// TRANSPORT: t is seconds from the start of the song, and everything (cues, lead, the sim's
// frame) is stamped against it.
// ============================================================================================
let ac=null, eng=null, an=null, anOut={bass:0,mid:0,high:0,rms:0,onset:0};
let playing=false, recording=false, looping=false;
let t0=0, songT=0, nextStep=0, timer=null;
const LOOKAHEAD=0.12, TICK=25;

function ensureAudio(){
 if(ac)return;
 ac=new (window.AudioContext||window.webkitAudioContext)();
 rebuildEngine();
}
function rebuildEngine(){
 if(!ac)return;
 if(eng){ try{ eng.master.disconnect(); }catch(e){} }   // the old graph goes quiet with its nodes
 eng=makeEngine(ac,snapshot());
 an=NGVShow.createAnalyser(ac,eng.master);
}
function nowT(){ return playing?clamp(ac.currentTime-t0,0,totalDur()):songT; }

function play(){
 ensureAudio();
 if(ac.state!=='running')ac.resume().catch(()=>{});
 if(playing){ pause(); return; }
 rebuildEngine();
 t0=ac.currentTime-songT;
 nextStep=Math.ceil(songT/eng.stepDur-1e-6);
 schedFrom=songT;
 playing=true;
 timer=setInterval(tick,TICK);
 document.getElementById('play').textContent='Pause';
 tick();
}
function pause(){
 if(!playing)return;
 songT=nowT(); playing=false;
 clearInterval(timer); timer=null;
 silence();
 document.getElementById('play').textContent='Play';
}
function stop(){
 const wasPlaying=playing;
 if(wasPlaying){ clearInterval(timer); timer=null; playing=false; }
 songT=0; silence();
 document.getElementById('play').textContent='Play';
 heldLead.clear(); drawKbd();
}
function seek(t){
 songT=clamp(t,0,totalDur());
 if(playing){ silence(); rebuildEngine(); t0=ac.currentTime-songT; nextStep=Math.ceil(songT/eng.stepDur-1e-6); schedFrom=songT; }
}
// a rebuild drops every node that was still ringing, which is what a Stop should sound like
function silence(){ if(!ac)return; rebuildEngine(); }

let schedFrom=0;
function tick(){
 if(!playing)return;
 const dur=totalDur(), now=ac.currentTime, until=now-t0+LOOKAHEAD;
 while(nextStep*eng.stepDur<until && nextStep<eng.steps){
  eng.scheduleStep(nextStep,t0+nextStep*eng.stepDur);
  nextStep++;
 }
 // the recorded lead is scheduled by time, not by step
 const win=Math.min(until,dur);
 if(win>schedFrom){ eng.scheduleLead(t0,schedFrom,win); schedFrom=win; }
 const t=now-t0;
 if(t>=dur){
  if(looping){ songT=0; silence(); t0=ac.currentTime; nextStep=0; schedFrom=0; }
  else { songT=dur; pause(); songT=0; }
 }
}

// THE LIGHT STATE: the lane of recorded cues plays back, and a press on the desk wins over it
// from the moment it is made. Both feed the sim next door and a local show for the readouts.
// ============================================================================================
const localShow=NGVShow.createShow();
const manual={look:song.look, lookAt:-1, palette:song.palette, palAt:-1, level:song.level, lvlAt:-1, hitAt:-9};
function cueState(t){
 let look=null,lookT=-2, pal=null,palT=-2, lvl=null,lvlT=-2, hit=-9;
 const cs=song.cues;
 for(let i=0;i<cs.length;i++){ const q=cs[i]; if(q.t>t)break;
  if(q.look){look=q.look;lookT=q.t;} if(q.palette){pal=q.palette;palT=q.t;}
  if(q.level!=null){lvl=q.level;lvlT=q.t;} if(q.hit)hit=q.t; }
 const pick=(cv,ct,mv,mt)=>(cv!=null&&ct>=mt)?cv:mv;
 return {
  look:pick(look,lookT,manual.look,manual.lookAt),
  palette:pick(pal,palT,manual.palette,manual.palAt),
  level:pick(lvl,lvlT,manual.level,manual.lvlAt),
  hitAt:Math.max(hit,manual.hitAt),
 };
}

let quant=0;
function qt(t){ if(!quant)return t; const g=quant*spb(); return Math.round(t/g)*g; }
function addCue(c){
 const t=qt(nowT());
 const q={t:+t.toFixed(4)}; Object.assign(q,c);
 song.cues.push(q); song.cues.sort((a,b)=>a.t-b.t);
 drawCues(); autosave();
}
function press(kind,val){
 const t=nowT();
 if(kind==='look'){ manual.look=val; manual.lookAt=t; }
 if(kind==='palette'){ manual.palette=val; manual.palAt=t; }
 if(kind==='level'){ manual.level=val; manual.lvlAt=t; }
 if(kind==='hit'){ manual.hitAt=t; }
 song.look=manual.look; song.palette=manual.palette; song.level=manual.level;
 if(playing&&recording){
  if(kind==='look')addCue({look:val});
  else if(kind==='palette')addCue({palette:val});
  else if(kind==='level')addCue({level:+val.toFixed(3)});
  else if(kind==='hit')addCue({hit:true});
 } else autosave();
 paintDesk();
}

 if(da)song.drums[b]=da; else delete song.drums[b]; }

 for(const k of Object.keys(song.drums)){ const i=+k; out[i<from?i:i+delta]=song.drums[k]; }

}

// ---- the lead keyboard. A piano transposed to the key's root: the letter row is the white keys,
// the row above the black keys between them, so the same shapes work in minor and major.
const WHITE=[['a',0],['s',2],['d',4],['f',5],['g',7],['h',9],['j',11],['k',12],['l',14],[';',16]];
const BLACK=[['w',1,0],['e',3,1],['t',6,3],['y',8,4],['u',10,5],['o',13,7],['p',15,8]];
let leadOct=0;
const heldLead=new Map();   // key -> {midi, t, node}
function leadMidi(semi){ const root=48+12+NOTE_NAMES.indexOf(song.key); return root+semi+leadOct*12; }
function drawKbd(){
 const k=$('kbd'); k.textContent='';
 const w=100/WHITE.length;
 WHITE.forEach(([key,semi],i)=>{
  const d=document.createElement('div'); d.className='w'+(heldLead.has(key)?' held':'');
  d.style.left=(i*w)+'%'; d.style.width=w+'%';
  const t=document.createElement('i'); t.textContent=key; d.appendChild(t); k.appendChild(d);
 });
 BLACK.forEach(([key,semi,after])=>{
  const d=document.createElement('div'); d.className='b'+(heldLead.has(key)?' held':'');
  d.style.left='calc('+((after+1)*w)+'% - 7px)'; d.style.width='14px'; k.appendChild(d);
 });
}
function leadDown(key,semi){
 if(heldLead.has(key))return;
 ensureAudio(); if(ac.state!=='running')ac.resume().catch(()=>{});
 const midi=leadMidi(semi), t=nowT();
 // a held note is a live voice; the recorded copy is what the bounce plays back
 const v=liveLead(midi);
 heldLead.set(key,{midi,t,v}); drawKbd();
}
function leadUp(key){
 const h=heldLead.get(key); if(!h)return;
 heldLead.delete(key); stopLiveLead(h.v);
 if(playing&&recording){
  const dur=Math.max(0.06,nowT()-h.t);
  song.lead.push({t:+h.t.toFixed(4),dur:+dur.toFixed(4),midi:h.midi});
  song.lead.sort((a,b)=>a.t-b.t); autosave();
 }
 drawKbd();
}
// the live voice while a key is down: the same tone as the engine's lead, held open
function liveLead(midi){
 if(!eng)return null;
 const a=ac, hz=mtof(midi), when=a.currentTime;
 const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=6;
 lp.frequency.setValueAtTime(2500,when); lp.frequency.linearRampToValueAtTime(1400,when+0.4);
 const g=a.createGain(); g.gain.setValueAtTime(0.0001,when); g.gain.linearRampToValueAtTime(LVL.lead,when+0.01);
 lp.connect(g); g.connect(eng.duck);
 const os=[];
 for(const [type,amp,oct] of [['sawtooth',1,0],['square',0.35,1]]){
  const o=a.createOscillator(); o.type=type; o.frequency.setValueAtTime(hz*Math.pow(2,oct),when);
  const am=a.createGain(); am.gain.value=amp; o.connect(am); am.connect(lp); o.start(when); os.push(o);
 }
 return {g,os};
}
function stopLiveLead(v){ if(!v||!ac)return; const w=ac.currentTime;
 try{ v.g.gain.cancelScheduledValues(w); v.g.gain.setValueAtTime(v.g.gain.value,w);
  v.g.gain.exponentialRampToValueAtTime(0.0001,w+0.12); for(const o of v.os)o.stop(w+0.2); }catch(e){} }

// ---- keys. Nothing fires while a field has focus, so typing a name never plays the hall.
function typing(){ const a=document.activeElement; if(!a)return false;
 const t=a.tagName; return t==='INPUT'||t==='SELECT'||t==='TEXTAREA'; }
window.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&!typing()){ e.preventDefault(); setFocus(!lightsFocus); return; }
 if(typing())return;
 if(e.repeat&&e.key!==' ')return;
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(k==='Enter'){ e.preventDefault(); play(); return; }
 if(k==='Escape'){ e.preventDefault(); stop(); return; }
 // shift R always arms Record. Plain r is the gold palette while the lights hold the letters,
 // so the two do not fight over the same key.
 if(e.key==='R'){ e.preventDefault(); $('rec').click(); return; }
 if(k===' '){ e.preventDefault(); press('hit',true); return; }
 const lvNow=cueState(nowT()).level;
 if(k==='['){ e.preventDefault(); press('level',clamp(lvNow-0.1,0,1)); return; }
 if(k===']'){ e.preventDefault(); press('level',clamp(lvNow+0.1,0,1)); return; }
 const li=KEYS_LOOK.indexOf(k);
 if(li>=0&&li<NGVShow.LOOK_NAMES.length){ e.preventDefault(); press('look',NGVShow.LOOK_NAMES[li]); return; }
 if(lightsFocus){
  const pi=KEYS_PAL.indexOf(k);
  if(pi>=0&&pi<NGVShow.PALETTE_NAMES.length){ e.preventDefault(); press('palette',NGVShow.PALETTE_NAMES[pi]); return; }
  return;
 }
 // lead focus: the letters are notes
 if(k==='z'){ leadOct=clamp(leadOct-1,-2,2); return; }
 if(k==='x'){ leadOct=clamp(leadOct+1,-2,2); return; }
 const w=WHITE.find(x=>x[0]===k); if(w){ e.preventDefault(); leadDown(k,w[1]); return; }
 const b=BLACK.find(x=>x[0]===k); if(b){ e.preventDefault(); leadDown(k,b[1]); return; }
 if(k==='r'){ e.preventDefault(); $('rec').click(); }   // r is free in lead focus, so it arms Record too
});
window.addEventListener('keyup',e=>{
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(heldLead.has(k))leadUp(k);
});
window.addEventListener('blur',()=>{ for(const k of Array.from(heldLead.keys()))leadUp(k); });

// ---- timeline
function drawTimeline(){ drawBlocks(); drawRuler(); drawCues(); }
function drawBlocks(){
 const box=$('secs'); box.textContent='';
 const total=Math.max(1,totalBars()); let b=0;
 song.sections.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='blk'+(i===sel?' on':'');
  d.style.left=(b/total*100)+'%'; d.style.width=(s.bars/total*100)+'%';
  const n=document.createElement('b'); n.textContent=s.name;
  d.append(n,document.createTextNode(s.bars+' bars, energy '+s.energy.toFixed(2)));
  d.onclick=e=>{ e.stopPropagation(); sel=i; drawSections(); drawGrid(); drawTimeline();
   seek(b*4*spb()); };
  box.appendChild(d); b+=s.bars;
 });
 $('tlinfo').textContent=totalBars()+' bars, '+fmt(totalDur())+', '+song.cues.length+' cues, '+song.lead.length+' lead notes';
}
function drawRuler(){
 const box=$('ruler'); box.textContent=''; const total=Math.max(1,totalBars());
 const every=total>48?8:total>24?4:total>12?2:1;
 for(let bar=0;bar<total;bar+=every){ const d=document.createElement('div');
  d.className='bar'+(bar%4===0?' down':''); d.style.left=(bar/total*100)+'%'; d.textContent=(bar+1);
  box.appendChild(d); }
}
function drawCues(){
 const box=$('lane'); box.textContent='';
 const dur=Math.max(0.001,totalDur());
 song.cues.forEach((q,idx)=>{
  const d=document.createElement('div'); d.className='cue'+(q.hit?' hit':(q.level!=null&&!q.look&&!q.palette?' lvl':''));
  d.style.left=(clamp(q.t/dur,0,1)*100)+'%';
  const pal=q.palette||cueState(q.t).palette, P=NGVShow.PALETTES[pal]||NGVShow.PALETTES.helix;
  d.style.background=q.hit?'#ffffff':hsvCss(q.look?P.A:P.B);
  const label=q.hit?'HIT':q.look?('look '+q.look):q.palette?('palette '+q.palette):('level '+q.level);
  d.title=label+' at '+fmt(q.t);
  d.onmouseenter=e=>showTip(e,label+'  '+fmt(q.t)+'  (click to delete)');
  d.onmouseleave=hideTip;
  d.onclick=e=>{ e.stopPropagation(); hideTip(); song.cues.splice(idx,1); drawTimeline(); autosave(); };
  box.appendChild(d);
 });
 $('tlinfo').textContent=totalBars()+' bars, '+fmt(totalDur())+', '+song.cues.length+' cues, '+song.lead.length+' lead notes';
}
$('tlbody').onclick=e=>{ const r=$('tlbody').getBoundingClientRect();
 seek((e.clientX-r.left)/r.width*totalDur()); };
function showTip(e,text){ const t=$('tip'); t.textContent=text; t.hidden=false;
 t.style.left=Math.min(window.innerWidth-t.offsetWidth-8,e.clientX+10)+'px'; t.style.top=(e.clientY-30)+'px'; }
function hideTip(){ $('tip').hidden=true; }
function fmt(t){ const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1); }

// ---- the frame loop: one clock for the readouts, the sim next door and the local show
const sim=$('sim');
const frame={t:0,bpm:124,beatN:0,beatPhase:0,barPhase:0,bass:0,mid:0,high:0,rms:0,onset:0};
let lastSecPlaying=-1;
function raf(){
 const t=nowT(), b=spb();
 frame.t=t; frame.bpm=song.bpm;
 const beats=t/b; frame.beatN=Math.floor(beats); frame.beatPhase=beats-frame.beatN;
 frame.barPhase=((frame.beatN%4)+frame.beatPhase)/4;
 if(playing&&an){ an.read(anOut); frame.bass=anOut.bass; frame.mid=anOut.mid; frame.high=anOut.high;
  frame.rms=anOut.rms; frame.onset=anOut.onset; }
 else { for(const k of ['bass','mid','high','rms'])frame[k]*=0.85; frame.onset=0; }

 const st=cueState(t);
 // the local show follows the same state, so the desk highlights match what the hall is doing
 Object.assign(localShow.frame,frame); Object.assign(localShow.state,st); localShow.on=true;
 if(sim.contentWindow)sim.contentWindow.postMessage({t:'show',frame,state:st,on:true},'*');

 $('clock').textContent=fmt(t);
 const bar=Math.floor(frame.beatN/4), beat=frame.beatN%4;
 $('barbeat').textContent=(bar+1)+':'+(beat+1);
 $('meterfill').style.width=(clamp(frame.rms,0,1)*100)+'%';
 $('head').style.left=(clamp(t/Math.max(0.001,totalDur()),0,1)*100)+'%';
 // the playing section and the step under the playhead, lit so the eye can follow
 const at=secAtBar(Math.min(bar,Math.max(0,totalBars()-1)));
 if(at&&at.i!==lastSecPlaying){ lastSecPlaying=at.i;
  document.querySelectorAll('#seclist .sec').forEach((el,i)=>el.classList.toggle('playing',i===at.i)); }
 const stepNow=playing?Math.floor(t/(b/4))%16:-1;
 document.querySelectorAll('#grid .cell').forEach(c=>c.classList.toggle('now',+c.dataset.s===stepNow&&playing));
 paintDesk();
 requestAnimationFrame(raf);
}

// ============================================================================================
// EXPORT: the same engine into an OfflineAudioContext, a 16 bit WAV out of it, then the frames
// the hall plays back against, measured off the rendered audio rather than guessed.
// ============================================================================================
function fft(re,im){
 const n=re.length;
 for(let i=1,j=0;i<n;i++){ let bit=n>>1; for(;j&bit;bit>>=1)j^=bit; j^=bit;
  if(i<j){ let t=re[i];re[i]=re[j];re[j]=t; t=im[i];im[i]=im[j];im[j]=t; } }
 for(let len=2;len<=n;len<<=1){ const ang=-2*Math.PI/len, wr=Math.cos(ang), wi=Math.sin(ang);
  for(let i=0;i<n;i+=len){ let cr=1,ci=0, h=len>>1;
   for(let k=0;k<h;k++){
    const ur=re[i+k], ui=im[i+k];
    const vr=re[i+k+h]*cr-im[i+k+h]*ci, vi=re[i+k+h]*ci+im[i+k+h]*cr;
    re[i+k]=ur+vr; im[i+k]=ui+vi; re[i+k+h]=ur-vr; im[i+k+h]=ui-vi;
    const ncr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=ncr;
   } } }
}
function pct99(a){ const c=Float32Array.from(a); c.sort(); return c[Math.max(0,Math.floor(0.99*(c.length-1)))]||1e-9; }
function normalise(a){ const p=pct99(a); const out=new Float32Array(a.length);
 for(let i=0;i<a.length;i++)out[i]=clamp(a[i]/p,0,1); return out; }
function smooth3(a){ const out=new Float32Array(a.length);
 for(let i=0;i<a.length;i++){ let s=0,c=0; for(let d=-1;d<=1;d++){ const j=i+d; if(j>=0&&j<a.length){s+=a[j];c++;} } out[i]=s/c; }
 return out; }
function analyseBuffer(buf){
 const N=2048, HOP=1024, sr=buf.sampleRate;
 const L=buf.getChannelData(0), R=buf.numberOfChannels>1?buf.getChannelData(1):L;
 const n=L.length, mono=new Float32Array(n);
 for(let i=0;i<n;i++)mono[i]=(L[i]+R[i])*0.5;
 const win=new Float32Array(N); for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
 const nf=Math.max(1,Math.floor((n-N)/HOP)+1);
 const rms=new Float32Array(nf), bass=new Float32Array(nf), mid=new Float32Array(nf),
       high=new Float32Array(nf), onset=new Float32Array(nf);
 const re=new Float32Array(N), im=new Float32Array(N), mag=new Float32Array(N/2), prev=new Float32Array(N/2);
 const hz=sr/N, bin=f=>clamp(Math.round(f/hz),1,N/2-1);
 const b0=bin(20),b1=bin(150),m1=bin(2000),h1=bin(11000);
 const meanPow=(lo,hi)=>{ let s=0,c=0; for(let i=lo;i<hi;i++){ s+=mag[i]*mag[i]; c++; } return c?s/c:0; };
 for(let f=0;f<nf;f++){
  const off=f*HOP; let e=0;
  for(let i=0;i<N;i++){ const v=(off+i<n?mono[off+i]:0)*win[i]; re[i]=v; im[i]=0; e+=v*v; }
  rms[f]=Math.sqrt(e/N);
  fft(re,im);
  let flux=0;
  for(let i=0;i<N/2;i++){ const m=Math.sqrt(re[i]*re[i]+im[i]*im[i]); mag[i]=m;
   const d=m-prev[i]; if(d>0)flux+=d; prev[i]=m; }
  bass[f]=meanPow(b0,b1); mid[f]=meanPow(b1,m1); high[f]=meanPow(m1,h1); onset[f]=flux;
 }
 // each array sits at 0..1 against its own 99th percentile, the bands smoothed a little first so
 // a single kick does not read as a flicker. The smoothing comes BEFORE the normalise on purpose:
 // averaging a normalised array pulls its peaks back under 1 and the band never reaches full.
 // The onset stays sharp, because a blunted transient is not an onset.
 return {
  rms:normalise(smooth3(rms)), bass:normalise(smooth3(bass)), mid:normalise(smooth3(mid)),
  high:normalise(smooth3(high)), onset:normalise(onset), nf, hop_s:HOP/sr,
 };
}
function wav16(buf){
 const ch=Math.min(2,buf.numberOfChannels), n=buf.length, sr=buf.sampleRate;
 const L=buf.getChannelData(0), R=ch>1?buf.getChannelData(1):L;
 const bytes=44+n*ch*2, ab=new ArrayBuffer(bytes), v=new DataView(ab);
 const str=(o,s)=>{ for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i)); };
 str(0,'RIFF'); v.setUint32(4,bytes-8,true); str(8,'WAVE'); str(12,'fmt ');
 v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,ch,true);
 v.setUint32(24,sr,true); v.setUint32(28,sr*ch*2,true); v.setUint16(32,ch*2,true); v.setUint16(34,16,true);
 str(36,'data'); v.setUint32(40,n*ch*2,true);
 let o=44;
 for(let i=0;i<n;i++){ for(let c=0;c<ch;c++){ const s=clamp(c?R[i]:L[i],-1,1);
  v.setInt16(o,s<0?s*32768:s*32767,true); o+=2; } }
 return ab;
}
const r4=x=>Math.round(x*10000)/10000;
const arr4=a=>Array.from(a,r4);

async function renderSong(onProgress){
 const snap=snapshot(), beat=60/snap.bpm;
 const bars=snap.sections.reduce((a,s)=>a+s.bars,0);
 const dur=bars*4*beat, tail=1.5;
 const oac=new OfflineAudioContext(2,Math.ceil((dur+tail)*44100),44100);
 const E=makeEngine(oac,snap);
 for(let i=0;i<E.steps;i++)E.scheduleStep(i,i*E.stepDur);
 E.scheduleLead(0,0,dur+tail);
 if(onProgress)onProgress(0.1);
 const buf=await oac.startRendering();
 return {buf,dur,beat,bars,snap};
}
function cueFile(name,r,frames){
 const beats=[], downs=[];
 for(let b=0;b*r.beat<r.dur+1e-6;b++){ beats.push(r4(b*r.beat)); if(b%4===0)downs.push(r4(b*r.beat)); }
 const secs=[]; let bar=0;
 for(const s of r.snap.sections){ const t0=bar*4*r.beat, t1=(bar+s.bars)*4*r.beat;
  secs.push({t0:r4(t0),t1:r4(t1),label:s.name,energy:r4(s.energy)}); bar+=s.bars; }
 return {
  file:name+'.wav', duration:r4(r.buf.duration), sr:44100, hop_s:r4(frames.hop_s),
  bpm:r.snap.bpm, key:r.snap.key, mode:r.snap.mode,
  beats, downbeats:downs, sections:secs,
  frames:{rms:arr4(frames.rms),bass:arr4(frames.bass),mid:arr4(frames.mid),high:arr4(frames.high),onset:arr4(frames.onset)},
  cues:song.cues.map(c=>({...c,t:r4(c.t)})),
  lead:song.lead.map(n=>({t:r4(n.t),dur:r4(n.dur),midi:n.midi})),
 };
}

  step('Done',1);
