<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#16181c">
<title>NGV Jam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="studio/ui.css">
<link rel="stylesheet" href="studio/jam.css">
<!-- THE JAM (Lloyd, 2026-09-05): the simple end of the studio. Tap a coloured tile per instrument,
     stack light layers on top, chain the stacks into sections and play the song. Colour does the
     explaining, so there is almost no text on the surface.
     This file is the shell and the load order only: the lightshow first (model.js reads its look
     and palette lists at load), then the model, the machines, the engine, the lights runtime, the
     export, the preset banks, and jam.js last. Every file is a classic script adding to
     window.Studio. Markup here is the frame; jam.js builds everything inside it. -->
<script src="show/lightshow.js"></script>
<script src="show/looks2.js"></script>
<script src="studio/model.js"></script>
<script src="studio/machines.js"></script>
<script src="studio/engine.js"></script>
<script src="studio/lights.js"></script>
<script src="studio/export.js"></script>
<script src="studio/presets.drums.js"></script>
<script src="studio/presets.pitch.js"></script>
<script src="studio/presets.lights.js"></script>
<script src="studio/presets.js"></script>
<!-- ?stub fills in whichever preset bank has not landed yet, so the page is usable mid-build -->
<script>if(new URLSearchParams(location.search).has('stub'))document.write('<script src="studio\/jam-stub.js"><\/script>');</script>
<script src="studio/jam.js" defer></script>
</head>
<body>

<div id="top">
 <button id="play" title="Play" aria-label="Play" aria-pressed="false"></button>
 <button id="stop" title="Stop" aria-label="Stop"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="2" fill="currentColor"/></svg></button>
 <button id="bpmval" title="Tempo, swing and humanise">124</button>
 <span class="sp"></span>
 <div id="tabs"></div>
 <button id="menubtn" title="More" aria-label="More" aria-haspopup="dialog"><svg width="4" height="18" viewBox="0 0 4 18" aria-hidden="true"><circle cx="2" cy="3" r="1.8" fill="currentColor"/><circle cx="2" cy="9" r="1.8" fill="currentColor"/><circle cx="2" cy="15" r="1.8" fill="currentColor"/></svg></button>
</div>

<div id="main">
 <div id="viewwrap">

  <section class="view on" id="view-jam">
   <div class="vhead"><div id="stylerow" role="group" aria-label="Style starters"></div></div>
   <div class="vbody" id="jambody"></div>
  </section>

  <section class="view" id="view-song">
   <div class="vhead">
    <button id="arcbtn">Shape</button>
    <span class="sp"></span>
    <button id="songplay" aria-pressed="false">Play song</button>
   </div>
   <div id="secstrip" role="group" aria-label="Sections"></div>
   <div class="vbody" id="songbody"></div>
  </section>

  <section class="view" id="view-hall">
   <div id="simwrap"><iframe id="sim" title="The hall" allow="autoplay"></iframe></div>
  </section>

 </div>
</div>

<nav id="nav"></nav>

<div id="toast" hidden></div>
<div id="veil" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>

</body></html>
