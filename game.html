<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Install</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#0e0f11;--rule:#2a2d33;--ink:#e9e6df;--dim:#9a978f;--accent:#b9a887;--ok:#6fbf8a;--panel:#16181c}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
#game{position:fixed;inset:0;background:#000}
#cv{width:100%;height:100%;display:block;touch-action:none}
#vignette{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.85) 100%);transition:opacity .6s}
#hud{position:absolute;left:12px;top:10px;right:12px;z-index:3;display:flex;align-items:flex-start;gap:10px;pointer-events:none}
#stats{display:flex;gap:8px;flex-wrap:wrap;color:#fff;text-shadow:0 1px 2px #000;font:13px/1.3 ui-monospace,Consolas,monospace}
#stats span{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.16);border-radius:4px;padding:5px 7px}
#prompt{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:4;max-width:min(520px,calc(100% - 24px));background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:8px 12px;text-align:center;color:#fff}
#prompt small{display:block;color:var(--dim);font-size:12px}
#overlay{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.76);padding:20px}
#overlay.gone{display:none}
#card{width:min(520px,100%);background:rgba(18,20,24,.96);border:1px solid var(--rule);border-radius:6px;padding:22px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:42px;line-height:1;margin:0 0 12px}
p{margin:0 0 14px;color:var(--dim)}
button{font:inherit;color:var(--ink);background:#000;border:1px solid var(--rule);border-radius:4px;padding:9px 13px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent)}
#summary{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:20px}
#summary.up{display:flex}
#summary .box{width:min(420px,100%);background:rgba(18,20,24,.96);border:1px solid var(--rule);border-radius:6px;padding:18px}
#summary h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px;font-weight:500;margin:0 0 8px;color:var(--accent)}
#touch{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
.stick{position:absolute;bottom:30px;width:118px;height:118px;border-radius:50%;border:1px solid rgba(255,255,255,.36);background:rgba(255,255,255,.06);opacity:.65;pointer-events:auto;touch-action:none}   /* the #touch layer is pointer-events:none; the sticks must opt back in or no touch ever reaches them (2026-09-04: the controls did nothing on the phone) */
.stick i{position:absolute;left:39px;top:39px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.75)}
#move{left:24px}
#look{right:24px}
#action{position:absolute;right:34px;bottom:166px;width:96px;height:96px;border-radius:50%;background:rgba(185,168,135,.25);border-color:rgba(185,168,135,.85);color:#fff;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;letter-spacing:.06em;pointer-events:auto}
#liftBtns{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:none;gap:12px;pointer-events:auto}
body.aboard #liftBtns{display:flex}
#liftBtns button{width:86px;height:64px;border-radius:6px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.42);font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;color:#fff}
@media (pointer:coarse){#touch{display:block} #prompt{bottom:156px} #stats{font-size:12px}}
</style>
</head><body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="vignette"></div>
  <div id="hud"><div id="stats"></div></div>
  <div id="prompt">Loading hall...</div>
  <div id="touch"><div id="move" class="stick"><i></i></div><div id="look" class="stick"><i></i></div><button id="action">ACTION</button><div id="liftBtns"><button id="liftUp">UP</button><button id="liftDown">DOWN</button></div></div>
  <div id="summary"><div class="box"><h2>Night Summary</h2><p id="summaryText"></p><button id="nextNight">Next night</button></div></div>
  <div id="overlay"><div id="card">
    <h1>The Install</h1>
    <p>Fit 768 lights across the 12 Gandel Hall columns before the morning clean-up.</p>
    <p>Desktop: WASD to move, mouse to look, E to act, F to drop, Space and Shift move the lift.</p>
    <p>Phone: left stick moves, right stick looks, ACTION uses the prompt.</p>
    <button id="start">Start Shift</button>
  </div></div>
</div>
<script type="module" src="./game/main.js"></script>
</body></html>
